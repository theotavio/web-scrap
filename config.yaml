geral:
  nome_projeto: "Quantificacao Multidimensional da Cobertura Jornalistica"
  autor: "Otavio Alves Lima"
  banco_dados: "dados/jornalismo.db"
  diretorio_logs: "logs"
  diretorio_relatorios: "relatorios"
  data_inicio: "2015-01-01"
  data_fim: "2025-12-31"
  anos_eleitorais: [2016, 2018, 2020, 2022, 2024]
  anos_nao_eleitorais: [2015, 2017, 2019, 2021, 2023, 2025]

banco:
  cache_size_kb: 64000
  mmap_size_bytes: 268435456

rede:
  user_agent_academico: "ProjetoPesquisaJornalismoUFC/1.0 (pesquisa.academica; contato: otavioal2907@gmail.com)"
  user_agent_googlebot: "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
  timeout_requisicao: 30
  max_tentativas: 3
  delay_entre_requisicoes: 0.05
  max_threads_coleta: 6
  max_threads_extracao: 8
  respeitar_robots: true

cdx:
  url_base: "https://web.archive.org/cdx/search/cdx"
  url_base_https: "https://web.archive.org/cdx/search/cdx"
  url_wayback_raw: "http://web.archive.org/web/{timestamp}id_/{url}"
  limite_por_requisicao: 1000
  pausa_segundos: 0.05
  backoff_inicial: 0.5
  max_backoff: 4.0

